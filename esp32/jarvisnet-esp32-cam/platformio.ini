; ESP32-CAM (AI-Thinker) — motion → JarvisNet → Telegram
; Flash/upload: imposta upload_port (es. COM3). A runtime la camera usa Wi‑Fi, non la seriale.

[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
board_build.partitions = min_spiffs.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1

; Aggiornamento via Wi‑Fi (dopo il primo flash USB). Sostituisci l'IP con quello del monitor seriale.
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = 192.168.1.44
upload_flags =
  --timeout=600
