<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/jarvis.css" />
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-left">
      <div id="connection-status-wrap" class="status-badge status-disconnected">
        <svg class="status-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path class="status-icon-connected" d="M2 8.5C5.5 4 18.5 4 22 8.5M5 12c2.5-2.8 11.5-2.8 14 0M8.5 15.5c1.2-1.3 5.8-1.3 7 0M12 19h.01"/>
          <path class="status-icon-disconnected" d="M2 8.5C5.5 4 18.5 4 22 8.5M5 12c2.5-2.8 11.5-2.8 14 0M8.5 15.5c1.2-1.3 5.8-1.3 7 0M12 19h.01M3 3l18 18"/>
        </svg>
        <span id="connection-status">DISCONNECTED</span>
      </div>
    </div>

    <nav class="system-strip" aria-label="System status">
      <div class="sys-metric">
        <div class="sys-metric-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M5 17l.8 2.2L8 20l-2.2.8L5 23l-.8-2.2L2 20l2.2-.8L5 17z"/></svg>
        </div>
        <div class="sys-metric-body">
          <span class="sys-metric-label">AI MODEL</span>
          <span class="sys-metric-status" data-sys-status="aiModelStatus">Active</span>
        </div>
        <span class="sys-metric-value" id="sys-ai-model">—</span>
      </div>
      <div class="sys-metric">
        <div class="sys-metric-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        </div>
        <div class="sys-metric-body">
          <span class="sys-metric-label">LANGUAGE</span>
          <span class="sys-metric-status" data-sys-status="languageStatus">Ready</span>
        </div>
        <span class="sys-metric-value" id="sys-language">—</span>
      </div>
      <div class="sys-metric">
        <div class="sys-metric-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>
        </div>
        <div class="sys-metric-body">
          <span class="sys-metric-label">CPU USAGE</span>
          <span class="sys-metric-status" data-sys-status="cpuStatus">Monitoring</span>
        </div>
        <span class="sys-metric-value" id="sys-cpu">—</span>
      </div>
      <div class="sys-metric">
        <div class="sys-metric-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="10" rx="1"/><path d="M7 7V5M11 7V5M15 7V5M19 7V5"/></svg>
        </div>
        <div class="sys-metric-body">
          <span class="sys-metric-label">MEMORY</span>
          <span class="sys-metric-status" data-sys-status="memoryStatus">Monitoring</span>
        </div>
        <span class="sys-metric-value" id="sys-memory">—</span>
      </div>
      <div class="sys-metric">
        <div class="sys-metric-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h4M6 14h8"/></svg>
        </div>
        <div class="sys-metric-body">
          <span class="sys-metric-label">GPU MEMORY</span>
          <span class="sys-metric-status" data-sys-status="gpuMemoryStatus">Monitoring</span>
        </div>
        <span class="sys-metric-value" id="sys-gpu-memory">—</span>
      </div>
      <div class="sys-metric">
        <div class="sys-metric-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="6" r="2"/><path d="M8 6h8M6 8v8M8 18h8"/></svg>
        </div>
        <div class="sys-metric-body">
          <span class="sys-metric-label">NETWORK</span>
          <span class="sys-metric-status" data-sys-status="networkStatus">Idle</span>
        </div>
        <span class="sys-metric-value" id="sys-network">0 Kbps</span>
      </div>
      <div class="sys-metric">
        <div class="sys-metric-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v6M8 5h8"/><path d="M4 14a8 8 0 0 1 16 0"/></svg>
        </div>
        <div class="sys-metric-body">
          <span class="sys-metric-label">POWER STATUS</span>
          <span class="sys-metric-status" data-sys-status="powerDetail">—</span>
        </div>
        <span class="sys-metric-value" id="sys-power">—</span>
      </div>
    </nav>

    <div class="top-bar-right">
      <div class="hud-clock">
        <time id="hud-time" class="hud-time" datetime="">00:00:00</time>
        <time id="hud-date" class="hud-date" datetime="">---</time>
      </div>
      <span class="top-bar-divider" aria-hidden="true"></span>
      <button type="button" id="btn-mic" class="mic-btn" aria-label="Abilita microfono" aria-pressed="false">
        <span class="mic-btn-ring" aria-hidden="true"></span>
        <svg class="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3M8 21h8"/>
        </svg>
        <span class="mic-label">IDLE</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="voice-settings-panel" aria-label="Voce e lingua">
      <header class="voice-panel-header">
        <span class="voice-panel-title">VOICE &amp; LANGUAGE</span>
        <span class="voice-panel-status" id="voice-panel-status">Loading</span>
      </header>
      <div class="voice-panel-wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="voice-panel-fields">
        <label class="voice-panel-row">
          <span class="voice-panel-label">Language</span>
          <select id="audio-language-select" class="voice-panel-select" aria-label="Lingua">
            <option value="">—</option>
          </select>
        </label>
        <label class="voice-panel-row">
          <span class="voice-panel-label">Voice</span>
          <select id="audio-voice-select" class="voice-panel-select" aria-label="Voce TTS">
            <option value="">—</option>
          </select>
        </label>
      </div>
    </aside>
    <div class="left-stage">
      <svg class="brain-bg" viewBox="0 0 640 640" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="brain-bg-fill" cx="50%" cy="46%" r="52%">
            <stop offset="0%" stop-color="rgba(0, 140, 180, 0.14)" />
            <stop offset="55%" stop-color="rgba(0, 70, 110, 0.08)" />
            <stop offset="100%" stop-color="rgba(2, 18, 36, 0)" />
          </radialGradient>
          <filter id="brain-bg-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <g class="brain-bg-shape" filter="url(#brain-bg-glow)">
          <path
            class="brain-bg-outline"
            d="M 320 102 C 255 102 198 118 168 158 C 138 198 128 252 136 302 C 144 352 168 398 208 432 C 242 460 278 476 320 478 C 362 476 398 460 432 432 C 472 398 496 352 504 302 C 512 252 502 198 472 158 C 442 118 385 102 320 102 Z"
          />
          <path
            class="brain-bg-inner"
            d="M 320 128 C 272 128 228 142 204 178 C 180 214 174 258 180 302 C 186 346 208 384 244 408 C 272 428 296 438 320 440 C 344 438 368 428 396 408 C 432 384 454 346 460 302 C 466 258 460 214 436 178 C 412 142 368 128 320 128 Z"
          />
          <path class="brain-bg-sulcus" d="M 320 118 C 318 200 322 290 320 468" />
          <path class="brain-bg-sulcus" d="M 248 168 C 268 220 278 280 268 360" />
          <path class="brain-bg-sulcus" d="M 392 168 C 372 220 362 280 372 360" />
          <path class="brain-bg-sulcus" d="M 200 260 C 250 248 290 252 320 255 C 350 252 390 248 440 260" />
        </g>
        <ellipse class="brain-bg-halo" cx="320" cy="300" rx="240" ry="265" />
      </svg>
      <aside class="hud-panel" aria-label="JARVIS HUD">
        <div class="hud-stage" id="hud-stage">
          <svg class="hud-orbit-links" id="hud-orbit-links" aria-hidden="true"></svg>
          <div class="module-orbit" id="module-orbit"></div>
          <div class="hud-core">
            <canvas id="hud" width="640" height="640"></canvas>
          </div>
        </div>
      </aside>
    </div>

    <section class="command-console" aria-label="Command console">
      <header class="console-header">
        <span class="console-title">&gt;_ COMMAND CONSOLE</span>
        <button type="button" id="btn-clear-chat" class="console-icon-btn" title="Clear chat" aria-label="Clear chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
          </svg>
        </button>
      </header>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/jarvis-system-status.js"></script>
  <script src="js/jarvis-voice-panel.js"></script>
  <script src="js/jarvis-clock.js"></script>
  <script src="js/jarvis-module-orbit.js"></script>
  <script src="js/jarvis-hud.js"></script>
  <script src="js/jarvis-signalr.js"></script>
</body>
</html>
